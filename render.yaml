services:
  - type: web
    name: rjc-software
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      npm install
      npm run build
    startCommand: uvicorn python_server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: NODE_VERSION
        value: "20"
